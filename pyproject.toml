[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-arena"
version = "0.1.0"
description = "Research platform for studying autonomous AI agents operating inside realistic terminal environments"
authors = [
    {name = "Rahul", email = "rahul@example.com"}
]
dependencies = [
    "ollama",
    "pydantic",
    "typer",
    "docker",
    "gymnasium",
    "pettingzoo"
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest"
]

[project.scripts]
arena = "arena.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["arena"]
